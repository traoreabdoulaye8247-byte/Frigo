    <div class="field">
      <label>Paiement à l'achat</label>
      <div class="seg" style="margin-bottom:0">
        <button type="button" class="on" id="payTout" onclick="setPayMode('tout')">Payé tout</button>
        <button type="button" id="payRien" onclick="setPayMode('rien')">Crédit (0)</button>

      </div>
      <input class="input" id="aPaye" type="number" inputmode="numeric" min="0" placeholder="Montant payé" style="display:none;margin-top:10px">

    </div>` : ''}

    <div class="field">
      <label>Date</label>
      <input class="input" id="aDate" type="date" value="${a?a.date:auj()}">
    </div>

    <div class="btn-group">
      ${a ? `<button class="btn btn-danger btn-sm" id="aDel" style="flex:0 0 auto">🗑️</button>` : ''}

      <button class="btn btn-ambre" id="aSave">${a?'Enregistrer':'Ajouter achat'}</button>
    </div>
  `);

  // Auto-remplissage quand on choisit un produit connu
  function appliquerMemo(nom){
    const m = memoProduit(nom);
    const memoDiv = $('#aMemo');
    if(m){
      $('#aCat').value = m.categorieId;
      // ne pré-remplir prix/carton que si les champs sont vides (mode ajout)
      if(!$('#aCartons').value && m.dernierCartons) $('#aCartons').value = m.dernierCartons;
      if(!$('#aPrix').value && m.dernierPrix) $('#aPrix').value = m.dernierPrix;

      $('#aCartons').value = ''; $('#aPrix').value = '';

    if(data.cartons<=0){ toast('Indiquez le nombre de cartons','err'); return; }
    if(data.prixGlobal<=0){ toast('Indiquez le prix de la facture','err'); return; }

    if(a){ modifierAchat(a.id, data); toast('Achat modifié ✓'); }
    else {
      // déterminer le montant payé selon le mode
      const mode = window._payMode || 'tout';
      if(mode==='tout') data.montantPaye = prixGlobal;
      else if(mode==='rien') data.montantPaye = 0;
      else data.montantPaye = Number($('#aPaye').value)||0;
      ajouterAchat(data);
      toast('Achat enregistré ✓');

    go('achats');

/* ============================================================

const POLES = {

}

/* Graphique à barres verticales (SVG) */
function graphBarres(data, couleur){
  const max = Math.max(...data.map(d=>d.valeur), 1);
  const W = 320, H = 160, pad = 24, bw = (W - pad*2) / data.length;
  const barres = data.map((d,i)=>{
    const h = Math.max(2, (d.valeur/max) * (H - pad*2));
    const x = pad + i*bw + bw*0.15;
    const y = H - pad - h;
    const w = bw*0.7;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${couleur}"/>
      <text x="${(x+w/2).toFixed(1)}" y="${H-pad+12}" font-size="8" fill="#94A3B8" text-anchor="middle">${d.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2A384E" stroke-width="1"/>
    ${barres}
    <text x="${pad}" y="14" font-size="9" fill="#5EEAD4">max ${fmt(max)} ${DB.parametres.devise}</text>
  </svg>`;
}

/* Graphique à barres horizontales (SVG) avec valeurs */
function graphBarresH(data){
  const max = Math.max(...data.map(d=>d.valeur), 1);
  const rowH = 30, W = 320, labelW = 90, barMax = W - labelW - 60;
  const rows = data.slice(0,8).map((d,i)=>{
    const w = Math.max(3, (d.valeur/max) * barMax);
    const y = i*rowH + 6;
    return `
      <text x="0" y="${y+13}" font-size="9" fill="#E8EEF6">${d.label.length>13?d.label.slice(0,12)+'…':d.label}</text>
      <rect x="${labelW}" y="${y}" width="${w.toFixed(1)}" height="18" rx="3" fill="${d.couleur||'#5EEAD4'}"/>
      <text x="${labelW+w+4}" y="${y+13}" font-size="8.5" fill="#94A3B8">${fmt(d.valeur)}</text>`;
  }).join('');
  const H = Math.min(data.length,8)*rowH + 10;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${rows}</svg>`;
}

function blocDetailCaisse(){

    if(sens==='+' || sens==='+v'){ signe='+'; couleur='var(--vert)'; }
    else if(sens==='-'){ signe='−'; couleur='var(--rouge)'; val=Math.abs(val); }
    else if(sens==='reg'){ signe = d.regularisations>=0?'+':'−'; couleur = d.regularisations>=0?'var(--vert)':'var(--rouge)'; val=Math.abs(val); }

/* Fiche complète d'une semaine déjà clôturée : chaque achat, chaque inventaire,
   chaque mouvement café — gardés tels quels depuis la clôture, jamais recalculés. */
function pageSemaineDetail(){
  const s = (DB.archivesSemaines||[]).find(x=>x.id===_semaineDetailId);
  const dev = DB.parametres.devise;
  if(!s || !s.detail){
    return `<div class="page"><div class="page-title">🔍 Détail de la semaine</div>
      <div class="empty"><div class="e-ic">🔍</div><div>Semaine introuvable</div></div>
      <button class="btn btn-ghost" onclick="go('archives')" style="margin-top:14px">← Retour à l'historique</button>
    </div>`;
  }
  const d = s.detail;
  const bloc = (titre, lignes, rendu, vide)=> `
    <div class="card" style="margin-bottom:14px">
      <div class="card-title" style="font-size:14px;margin-bottom:8px">${titre}</div>
      ${lignes.length===0 ? `<div class="hint">${vide}</div>` : lignes.map(rendu).join('')}
    </div>`;
  return `
  <div class="page">
    <div class="page-title">🔍 Semaine du ${dateFr(s.dateDebut)}</div>
    <div class="page-sub">Au ${dateFr(s.dateFin)} — détail complet, gardé tel quel depuis la clôture.</div>
    <button class="btn btn-ghost btn-sm" onclick="go('archives')" style="margin-bottom:14px">← Retour à l'historique</button>

    ${bloc('📥 Achats ('+d.achats.length+')', [...d.achats].sort((a,b)=>a.date<b.date?1:-1), a=>`
      <div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${a.produit||'?'}</div>
      <div class="cat-meta">${dateFr(a.date)} • ${a.fournisseur||'Divers'}${a.quantite?' • '+fmt(a.quantite)+' u.':''}</div></div>
      <span style="font-weight:700">${fmt(a.prixGlobal)} ${dev}</span></div>`, "Aucun achat cette semaine")}

    ${bloc('📋 Inventaires ('+d.inventaires.length+')', [...d.inventaires].sort((a,b)=>a.date<b.date?1:-1), inv=>`
      <div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${dateFr(inv.date)}${inv.heure?' • '+inv.heure:''}</div>
      <div class="cat-meta">${(inv.lignes||[]).filter(l=>l.vendu>0).map(l=>l.nom+': '+fmt(l.vendu)).join(', ')||'—'}</div></div>
      <span style="font-weight:700;color:var(--vert)">${fmt(inv.totalCA)} ${dev}</span></div>`, "Aucun inventaire cette semaine")}

    ${bloc('📅 Ventes notées à la main ('+d.ventesJour.length+')', [...d.ventesJour].sort((a,b)=>a.date<b.date?1:-1), v=>`
      <div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${dateFr(v.date)}</div>
      <div class="cat-meta">${v.note||'—'}</div></div><span style="font-weight:700">${fmt(v.montant)} ${dev}</span></div>`, "Aucune saisie cette semaine")}

    ${bloc('☕ Café — ventes ('+d.cafeVentesDetail.length+')', [...d.cafeVentesDetail].sort((a,b)=>a.date<b.date?1:-1), v=>`
      <div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${dateFr(v.date)}</div>
      <div class="cat-meta">${v.note||'—'}</div></div><span style="font-weight:700;color:var(--vert)">${fmt(v.montant)} ${dev}</span></div>`, "Aucune vente café cette semaine")}

    ${bloc('☕ Café — achats ('+d.cafeAchatsDetail.length+')', [...d.cafeAchatsDetail].sort((a,b)=>a.date<b.date?1:-1), a=>`
      <div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${a.article||'?'}</div>
      <div class="cat-meta">${dateFr(a.date)}</div></div><span style="font-weight:700;color:var(--rouge)">${fmt(a.montant)} ${dev}</span></div>`, "Aucun achat café cette semaine")}

    ${d.depenses.length ? bloc('💸 Dépenses ('+d.depenses.length+')', [...d.depenses].sort((a,b)=>a.date<b.date?1:-1), dep=>`
      <div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${dep.motif}</div>
      <div class="cat-meta">${dateFr(dep.date)}</div></div><span style="font-weight:700;color:var(--rouge)">${fmt(dep.montant)} ${dev}</span></div>`, '') : ''}

    ${d.rations.length ? bloc('🍚 Ration du vendeur ('+d.rations.length+')', [...d.rations].sort((a,b)=>a.date<b.date?1:-1), r=>`
      <div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${r.type==='semaine'?'Fin de semaine':'Ration du jour'}</div>
      <div class="cat-meta">${dateFr(r.date)}</div></div><span style="font-weight:700;color:var(--rouge)">${fmt(r.montant)} ${dev}</span></div>`, '') : ''}
  </div>`;
}

function bindPlus(){
  // --- Changer le PIN ---
  $('#btnChangePin')?.addEventListener('click', openChangePinSheet);

  // --- Stock de départ ---
  $('#btnStockDepart')?.addEventListener('click', openStockDepartSheet);

  // --- Catégories ---
  $('#addCat')?.addEventListener('click', ()=> openCatEdit());

  // --- Dépense ---
  $('#addDep')?.addEventListener('click', ()=> openDepenseSheet());

  // --- Versement ---
  $('#addVers')?.addEventListener('click', ()=> openVersementSheet());

  // --- Export (fonction partagée) ---
  function faireExport(){
    const data = JSON.stringify(DB, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `frigo_sauvegarde_${auj()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    marquerSauvegarde();
    toast('Sauvegarde téléchargée ✓');
  }
  function faireImport(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!imported.categories){ toast('Fichier invalide','err'); return; }
        DB = imported;
        migrerDB();          // recrée les champs manquants (emprunts, café…) des anciennes sauvegardes
        sauverDB();
        toast('Données restaurées ✓');
        renderApp();
      }catch(err){ toast('Erreur de lecture','err'); }
    };
    reader.readAsText(file);
  }

  // Gros boutons visibles (haut de page)
  $('#btnExportBig')?.addEventListener('click', faireExport);
  $('#btnImportBig')?.addEventListener('click', ()=> $('#importFileBig').click());
  $('#importFileBig')?.addEventListener('change', e=> faireImport(e.target.files[0]));

  // --- Export ---
  $('#btnExport')?.addEventListener('click', faireExport);

  // --- Import ---
  $('#btnImport')?.addEventListener('click', ()=> $('#importFile').click());
  $('#importFile')?.addEventListener('change', e=> faireImport(e.target.files[0]));

  // --- Reset ---
  $('#btnReset')?.addEventListener('click', ()=>{
    sheet(`
      <h2>🗑️ Réinitialiser</h2>
      <div class="s-sub">Cette action efface TOUTES vos données (achats, inventaires, dépenses). Exportez d'abord si besoin.</div>
      <div class="btn-group">
        <button class="btn btn-ghost" onclick="closeSheet()">Annuler</button>
        <button class="btn btn-danger" id="rConfirm">Oui, tout effacer</button>
      </div>`);
    $('#rConfirm').addEventListener('click', ()=>{
      DB = dbVide(); sauverDB(); closeSheet(); toast('Données réinitialisées'); renderApp();
    });
  });

  // --- Réglages boutique ---
  $('#saveSet')?.addEventListener('click', ()=>{
    DB.parametres.boutique = nomSain($('#setBoutique').value) || 'Mon Frigo';
    sauverDB(); toast('Enregistré ✓'); renderApp();
  });
}

function openMouvementSheet(type, id){
  const liste = type==='dep' ? DB.depenses : DB.versements;
  const m = liste.find(x=>x.id===id);
  if(!m) return;
  const estDep = type==='dep';
  sheet(`
    <h2>${estDep?'💸 Dépense':'💵 Versement'}</h2>
    <div class="s-sub">Modifier ou supprimer</div>
    ${estDep ? `
      <div class="field"><label>Motif</label><input class="input" id="mMotif" value="${m.motif||''}"></div>
    ` : `
      <div class="field"><label>Note (optionnel)</label><input class="input" id="mNote" value="${m.note||''}"></div>
    `}
    <div class="field"><label>Montant</label>
      <input class="input" id="mMontant" type="number" inputmode="numeric" value="${m.montant}"></div>
    <div class="field"><label>Date</label>
      <input class="input" id="mDate" type="date" value="${m.date}"></div>

      <button class="btn btn-danger btn-sm" id="mDel" style="flex:0 0 auto">🗑️</button>
      <button class="btn btn-ghost" onclick="closeSheet()">Annuler</button>
      <button class="btn btn-primary" id="mSave">Enregistrer</button>
    </div>
  `);

  $('#mSave').addEventListener('click', ()=>{
    const montant = Number($('#mMontant').value)||0;
    if(montant<=0){ toast('Montant invalide','err'); return; }
    m.montant = montant;
    m.date = $('#mDate').value || m.date;

  $('#mDel').addEventListener('click', ()=>{

    else DB.versements = DB.versements.filter(x=>x.id!==id);
    sauverDB();
    toast('Supprimé');
    closeSheet();
    go('plus');
  });
}

      <button class="btn btn-primary" id="pinSave">Enregistrer</button>
    </div>
  `);

  $('#pinSave').addEventListener('click', ()=>{
    const ancien = $('#pinOld').value;
    const nouveau = $('#pinNew').value;
    const conf = $('#pinConf').value;
    const actuel = localStorage.getItem(PIN_KEY);

    if(ancien !== actuel){ toast('Code actuel incorrect','err'); return; }
    if(nouveau.length !== 4 || !/^\d{4}$/.test(nouveau)){ toast('Le nouveau code doit avoir 4 chiffres','err'); return; }

    if(nouveau === ancien){ toast('Choisissez un code différent','err'); return; }

    localStorage.setItem(PIN_KEY, nouveau);
    toast('Code PIN modifié ✓');
    closeSheet();
  });
}

    const seuil = Math.max(0, Number($('#cSeuil').value)||0);
    if(!nom){ toast('Indiquez le nom','err'); return; }
    if(prix<=0){ toast('Indiquez le prix','err'); return; }
    if(cat){
      cat.nom = nomSain(nom); cat.prix = prix; cat.couleur = selCol; cat.seuil = seuil;
    } else {
      DB.categories.push({id:uid('cat'), nom:nomSain(nom), prix, couleur:selCol, seuil});
    }
    sauverDB(); toast('Catégorie enregistrée ✓'); closeSheet(); go('plus');
  });

  $('#cDel')?.addEventListener('click', ()=>{
    // vérifier qu'aucun achat n'utilise cette catégorie

    DB.categories = DB.categories.filter(c=>c.id!==cat.id);

  });

function majEcartRegul(inp){
  const theo = Number(inp.dataset.theo)||0;
  const span = document.querySelector('.regEcart[data-for="'+inp.dataset.cat+'"]');
  if(inp.value===''){ if(span){span.textContent=''; } majResumeRegul(); return; }
  const phys = Number(inp.value)||0;
  const ec = phys - theo;
  if(span){
    span.textContent = (ec>0?'+':'') + ec;
    span.style.color = ec===0 ? 'var(--texte-doux)' : (ec<0 ? 'var(--rouge)' : 'var(--vert)');
  }
  majResumeRegul();
}

function majResumeRegul(){
  const inputs = document.querySelectorAll('.regInp');
  let nb = 0;
  inputs.forEach(inp=>{
    if(inp.value==='') return;
    const ec = (Number(inp.value)||0) - (Number(inp.dataset.theo)||0);
    if(ec!==0) nb++;
  });
  const r = $('#regResume');
  if(r) r.textContent = nb===0 ? 'Aucun écart pour le moment.' : nb+' catégorie(s) avec un écart à régulariser.';
}

function confirmerRegularisation(){
  const comptes = {};
  document.querySelectorAll('.regInp').forEach(inp=>{
    if(inp.value!=='') comptes[inp.dataset.cat] = inp.value;
  });
  const motif = $('#regMotif') ? $('#regMotif').value : '';
  const user = $('#regUser') ? $('#regUser').value.trim() : '';
  // mémoriser le nom du gérant pour la prochaine fois
  if(user){ if(!DB.parametres) DB.parametres={}; DB.parametres.gerant = nomSain(user); }

  const apercu = apercuRegularisation(comptes).filter(x=>x.ecart!==0);
  if(apercu.length===0){ toast('Aucun écart à régulariser','err'); return; }

  const reg = regulariserStock({comptes, motif, user});
  if(!reg){ toast('Aucun écart à régulariser','err'); return; }
  toast(reg.lignes.length + ' catégorie(s) régularisée(s) ✓');
  closeSheet();
  go('stock');
}

function lancerRecherche(terme){
  const zone = $('#rechResultats');
  if(!zone) return;
  if(!terme || terme.trim().length<1){ zone.innerHTML = '<div class="hint">Commencez à taper…</div>'; return; }
  const r = rechercher(terme);
  const total = r.achats.length + r.produits.length + r.fournisseurs.length + r.clients.length;
  if(total===0){ zone.innerHTML = '<div class="empty" style="padding:20px"><div style="font-size:13px">Aucun résultat</div></div>'; return; }
  let html = '';
  if(r.produits.length){
    html += `<div class="card" style="margin-bottom:10px"><div class="card-title" style="font-size:13px;margin-bottom:6px">🧴 Produits (${r.produits.length})</div>
      ${r.produits.slice(0,10).map(p=>{ const cat=DB.categories.find(c=>c.id===p.categorieId); return `<div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${p.nom}</div><div class="cat-meta">${cat?cat.nom:''}</div></div></div>`; }).join('')}</div>`;
  }
  if(r.fournisseurs.length){
    html += `<div class="card" style="margin-bottom:10px"><div class="card-title" style="font-size:13px;margin-bottom:6px">🏢 Fournisseurs (${r.fournisseurs.length})</div>

  }
  if(r.clients.length){
    html += `<div class="card" style="margin-bottom:10px"><div class="card-title" style="font-size:13px;margin-bottom:6px">👥 Clients (${r.clients.length})</div>
      ${r.clients.map(c=>`<div class="cat-row" style="cursor:pointer" ><div class="cat-info"><div class="cat-name" style="font-size:14px">${c.nom}</div><div class="cat-meta">doit ${fmt(soldeClient(c.id))}</div></div></div>`).join('')}</div>`;
  }
  if(r.achats.length){
    html += `<div class="card"><div class="card-title" style="font-size:13px;margin-bottom:6px">📥 Achats (${r.achats.length})</div>
      ${r.achats.slice(0,15).map(a=>`<div class="cat-row"><div class="cat-info"><div class="cat-name" style="font-size:14px">${a.produit}</div><div class="cat-meta">${dateFr(a.date)}${a.fournisseur?' • '+a.fournisseur:''}</div></div><span style="font-weight:700">${fmt(a.prixGlobal)}</span></div>`).join('')}</div>`;
  }
  zone.innerHTML = html;
}

function majEcartCaisse(){
  const el = $('#rcPhys');
  const zone = $('#rcEcart');
  if(!el || !zone) return;
  if(el.value===''){ zone.textContent=''; return; }
  const ec = ecartCaisse(el.value);
  if(ec===0){ zone.innerHTML = '<span style="color:var(--vert)">✓ La caisse est juste, aucun écart.</span>'; }
  else if(ec<0){ zone.innerHTML = '<span style="color:var(--rouge)">Il manque '+fmt(-ec)+' '+DB.parametres.devise+' par rapport au théorique.</span>'; }
  else { zone.innerHTML = '<span style="color:var(--vert)">Il y a '+fmt(ec)+' '+DB.parametres.devise+' de plus que le théorique.</span>'; }
}

/* ============================================================
   VÉRIFICATEUR DE MISE À JOUR
   Compare la version installée avec celle en ligne (GitHub Pages)
   et propose de recharger en contournant le cache.
   ============================================================ */
function versionApp(){
  const m = document.querySelector('meta[name="frigo-version"]');
  return m ? m.content : '?';
}

async function verifierMiseAJour(){
  try{
    if(location.protocol === 'file:') return 'impossible';
    const url = location.pathname + '?maj=' + Date.now();   // requête unique = cache contourné
    let txt = '';
    // On ne télécharge que les 3 premiers Ko : la version est tout en haut du fichier.
    // (avant, on téléchargeait les 358 Ko de l'application à chaque vérification)
    try{
      const r = await fetch(url, {cache:'no-store', headers:{'Range':'bytes=0-3071'}});
      if(r.ok || r.status === 206) txt = await r.text();
    }catch(e){}
    if(txt.indexOf('frigo-version') < 0){   // serveur qui ne gère pas les extraits : on reprend tout
      const r2 = await fetch(url, {cache:'no-store'});
      if(!r2.ok) return 'impossible';
      txt = await r2.text();
    }
    const m = txt.match(/frigo-version" content="([^"]+)"/);
    if(!m || !m[1]) return 'impossible';
    if(m[1] !== versionApp()){ afficherBandeauMAJ(m[1]); return 'nouvelle'; }
    return 'ajour';
  }catch(e){ return 'impossible'; }
}

function afficherBandeauMAJ(nouvelleVersion){
  if(document.getElementById('bandeauMaj')) return;
  const b = document.createElement('div');
  b.id = 'bandeauMaj';
  b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:78px;z-index:9999;background:linear-gradient(135deg,#F59E0B,#FBBF24);color:#221703;font-weight:800;padding:13px 15px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.5);text-align:center;font-size:14px;cursor:pointer';
  b.innerHTML = '🔄 Nouvelle version disponible<br><span style="font-weight:600;font-size:12px">Touchez ici pour mettre à jour — vos données sont conservées</span>';
  b.onclick = appliquerMiseAJour;
  document.body.appendChild(b);
}

let _majEnCours = false;
async function appliquerMiseAJour(){
  if(_majEnCours) return;          // évite de relancer si on touche plusieurs fois
  _majEnCours = true;
  // 1) Répondre TOUT DE SUITE : l'utilisateur doit voir que sa touche a été prise.

function ventesParJour(){
  const map = {};
  const vide = (d)=>({ date:d, total:0, articles:0, categories:{}, saisi:0 });
  for(const inv of DB.inventaires){
    if(!map[inv.date]) map[inv.date] = vide(inv.date);
    const j = map[inv.date];
    j.total += inv.totalCA;
    for(const l of inv.lignes){
      if(l.vendu > 0){
        j.articles += l.vendu;
        if(!j.categories[l.categorieId]) j.categories[l.categorieId] = { nom:l.nom, prix:l.prix, vendu:0, montant:0 };
        j.categories[l.categorieId].vendu += l.vendu;
        j.categories[l.categorieId].montant += l.montant;
      }
    }
  }
  for(const v of (DB.ventesJour||[])){
    if(!map[v.date]) map[v.date] = vide(v.date);
    map[v.date].saisi += v.montant;
  }
  return Object.values(map).sort((a,b)=> a.date<b.date?1:-1);
}

/* Périodes couvertes par chaque inventaire.
   Un inventaire couvre tous les jours écoulés depuis le comptage précédent :
   c'est à cette échelle (et pas jour par jour) que la comparaison a un sens. */
/* Argent que le vendeur détient et qui n'est pas encore entré en caisse.
   Les ventes n'alimentent la caisse qu'au moment de l'inventaire : entre deux
   comptages, ce que vous notez au jour le jour reste « en attente ».
   Les rations déjà données sont retirées : cet argent, le vendeur l'a gardé. */
function dateDernierInventaire(){
  let d = null;
  for(const inv of DB.inventaires){ if(!d || inv.date > d) d = inv.date; }
  return d;
}
/* Depuis combien de jours n'avez-vous pas compté ?
   Entre deux inventaires, les achats et rations sortent tout de suite,
   mais les ventes n'entrent qu'au comptage : la caisse paraît chuter.
   Cette alerte l'explique, même si vous ne notez pas vos ventes du jour. */
function blocVentesNonComptees(){
  const dep = dateDernierInventaire();
  const dev = DB.parametres.devise;
  const apres = (dt)=> !dep || dt > dep;
  // argent sorti depuis le dernier comptage (achats payés, rations, dépenses)
  let sorti = 0;
  for(const p of (DB.paiements||[])){ if(apres(p.date)) sorti += Number(p.montant)||0; }
  for(const r of (DB.rationsVendeur||[])){ if(apres(r.date)) sorti += Number(r.montant)||0; }
  for(const d of (DB.depenses||[])){ if(apres(d.date)) sorti += Number(d.montant)||0; }
  if(sorti <= 0) return '';
  let jours = 0;
  if(dep){
    const ms = new Date(auj()).getTime() - new Date(dep).getTime();
    jours = Math.max(0, Math.round(ms/86400000));
  }
  const att = argentEnAttente();
  return `<div class="card" style="border-color:var(--ambre);background:rgba(251,191,36,.08);margin-bottom:14px">
    <div class="card-title" style="font-size:14px;margin-bottom:6px;color:var(--ambre)">⏳ Vos ventes ne sont pas encore comptées</div>
    <div class="hint" style="line-height:1.6">
      ${dep ? `Dernier inventaire : <b>${dateFr(dep)}</b>${jours>0?` (il y a ${jours} jour${jours>1?'s':''})`:''}.` : `Vous n'avez pas encore fait d'inventaire.`}<br>
      Depuis, <b>${fmt(sorti)} ${dev}</b> sont sortis de la caisse (achats, ration, dépenses) mais l'argent de vos ventes <b>n'y est pas encore entré</b>.
      ${att.ventes>0 ? `<br>Ventes notées à la main depuis : <b>${fmt(att.ventes)} ${dev}</b>.` : ''}
    </div>
    <div class="hint" style="margin-top:8px">C'est normal : votre argent est dans le frigo, sous forme de marchandise vendue. Faites l'inventaire pour qu'il entre en caisse.</div>
    <button class="btn btn-ambre" onclick="go('inventaire')" style="margin-top:10px">📋 Faire l'inventaire maintenant</button>
  </div>`;
}

function argentEnAttente(){
  const dep = dateDernierInventaire();
  const apres = (dt)=> !dep || dt > dep;
  let ventes = 0;
  for(const v of (DB.ventesJour||[])){ if(apres(v.date)) ventes += v.montant; }
  let rations = 0;
  for(const r of (DB.rationsVendeur||[])){ if(apres(r.date)) rations += r.montant; }
  return { depuis: dep, ventes, rations, net: ventes - rations };
}

function periodesInventaire(){
  const parDate = {};
  for(const inv of DB.inventaires){
    if(!parDate[inv.date]) parDate[inv.date] = { date: inv.date, calcule: 0 };
    parDate[inv.date].calcule += inv.totalCA;
  }
  const dates = Object.values(parDate).sort((a,b)=> a.date<b.date?-1:1);
  const saisies = DB.ventesJour || [];
  const res = [];
  let precedent = null;
  for(const d of dates){
    let saisi = 0;
    for(const v of saisies){
      if((!precedent || v.date > precedent) && v.date <= d.date) saisi += v.montant;
    }
    res.push({ debut: precedent, fin: d.date, calcule: d.calcule, saisi, enCours:false });
    precedent = d.date;
  }
  // période en cours : saisies faites après le dernier inventaire
  let apres = 0;
  for(const v of saisies){ if(!precedent || v.date > precedent) apres += v.montant; }
  if(apres > 0) res.push({ debut: precedent, fin: null, calcule: null, saisi: apres, enCours:true });
  return res.reverse();
}

/* Journal de vente : montant saisi à la main pour un jour donné.
   Volontairement séparé de la caisse (les inventaires l'alimentent déjà)
   pour ne jamais compter le même argent deux fois. */
function ajouterVenteJour({date, montant, note}){

  const v = { id: uid('vj'), date: date||auj(), montant, note:(note||'').trim() };
  DB.ventesJour.push(v);
  sauverDB();
  return v;
}

/* ============================================================
   CAFÉ DÉTAILLÉ (jour par jour, achats par article, stats)
   ============================================================ */
function cafeParJour(debut, fin){
  const dans = (d)=> (!debut || d>=debut) && (!fin || d<=fin);
  const map = {};
  for(const v of (DB.cafeVentes||[])){
    if(!dans(v.date)) continue;
    if(!map[v.date]) map[v.date] = { date:v.date, ventes:0, achats:0, nbVentes:0 };
    map[v.date].ventes += v.montant; map[v.date].nbVentes++;
  }
  for(const a of (DB.cafeAchats||[])){
    if(!dans(a.date)) continue;
    if(!map[a.date]) map[a.date] = { date:a.date, ventes:0, achats:0, nbVentes:0 };
    map[a.date].achats += a.montant;
  }
  return Object.values(map).map(j=>({ ...j, resultat: j.ventes - j.achats }))
    .sort((a,b)=> a.date<b.date?1:-1);
}

function cafeAchatsParArticle(debut, fin){
  const dans = (d)=> (!debut || d>=debut) && (!fin || d<=fin);
  const map = {};
  for(const a of (DB.cafeAchats||[])){
    if(!dans(a.date)) continue;
    const cle = (a.article||'Autre').trim().toLowerCase();
    if(!map[cle]) map[cle] = { article:(a.article||'Autre').trim()||'Autre', total:0, nb:0 };
    map[cle].total += a.montant; map[cle].nb++;
  }
  return Object.values(map).sort((a,b)=> b.total - a.total);
}

function statsCafeAvancees(debut, fin){
  const jours = cafeParJour(debut, fin).filter(j=>j.ventes>0);
  const total = jours.reduce((s,j)=>s+j.ventes,0);
  let meilleur = null;
  for(const j of jours){ if(!meilleur || j.ventes>meilleur.ventes) meilleur = j; }
  return {
    nbJours: jours.length,
    moyenneJour: jours.length ? Math.round(total/jours.length) : 0,
    meilleurJour: meilleur
  };
}

/* ============================================================
   COMPARAISON DES SEMAINES (à partir des archives)
   ============================================================ */
function blocComparaisonSemaines(){
  const arch = [...(DB.archivesSemaines||[])].sort((a,b)=> a.cloturLe<b.cloturLe?-1:1);
  if(arch.length < 2) return '';
  const dev = DB.parametres.devise;
  const lab = (s)=> dateFr(s.dateFin || s.cloturLe).slice(0,5);
  const dernieres = arch.slice(-8);
  const dataV = dernieres.map(s=>({ label: lab(s), valeur: Math.max(0, s.ventes||0) }));
  const dataB = dernieres.map(s=>({ label: lab(s), valeur: Math.max(0, s.benefice||0) }));
  const moyV = Math.round(arch.reduce((t,s)=>t+(s.ventes||0),0)/arch.length);
  const moyB = Math.round(arch.reduce((t,s)=>t+(s.benefice||0),0)/arch.length);
  let best = arch[0];
  for(const s of arch){ if((s.ventes||0) > (best.ventes||0)) best = s; }
  const der = arch[arch.length-1], prec = arch[arch.length-2];
  const diff = (der.ventes||0) - (prec.ventes||0);
  const pct = (prec.ventes>0) ? Math.round(diff/prec.ventes*100) : null;
  const coul = diff>0 ? 'var(--vert)' : (diff<0 ? 'var(--rouge)' : 'var(--texte-doux)');
  const ligne = (label, valeur, style)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:var(--texte-doux)">${label}</span><span style="${style||'font-weight:600'}">${valeur}</span></div>`;
  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-title" style="font-size:14px;margin-bottom:8px">📈 Ventes par semaine</div>
      ${graphBarres(dataV, '#34D399')}
      <div class="card-title" style="font-size:14px;margin:14px 0 8px">💰 Bénéfice par semaine</div>
      ${graphBarres(dataB, '#FBBF24')}
      <div style="border-top:1px solid var(--bord);margin:12px 0 6px"></div>
      ${ligne('Moyenne des ventes', fmt(moyV)+' '+dev)}
      ${ligne('Moyenne du bénéfice', fmt(moyB)+' '+dev)}
      ${ligne('Meilleure semaine', lab(best)+' • '+fmt(best.ventes)+' '+dev)}
      ${ligne('Dernière vs précédente', (diff>0?'+':'')+fmt(diff)+' '+dev+(pct!==null?' ('+(pct>0?'+':'')+pct+'%)':''), 'font-weight:700;color:'+coul)}
    </div>`;
}
/* ============================================================
   SITUATION DES ACHATS PAR DATE
   (les « soldes reportés » créés à la clôture sont exclus :
    ce sont des dettes reprises, pas de nouveaux achats)
   ============================================================ */
function achatsParJour(debut, fin){
  const dans = (d)=> (!debut || d>=debut) && (!fin || d<=fin);
  const map = {};
  for(const a of DB.achats){
    if(a.reporte) continue;
    if(!dans(a.date)) continue;
    if(!map[a.date]) map[a.date] = { date:a.date, total:0, paye:0, nb:0, lignes:[] };
    const j = map[a.date];
    j.total += Number(a.prixGlobal)||0;
    j.paye  += Number(a.montantPaye)||0;
    j.nb++;
    j.lignes.push(a);
  }
  return Object.values(map)
    .map(j=>({ ...j, credit: Math.max(0, j.total - j.paye) }))
    .sort((a,b)=> a.date<b.date?1:-1);
}

function achatsParFournisseur(debut, fin){
  const dans = (d)=> (!debut || d>=debut) && (!fin || d<=fin);
  const map = {};
  for(const a of DB.achats){
    if(a.reporte) continue;
    if(!dans(a.date)) continue;
    const nom = (a.fournisseur||'').trim() || 'Divers';
    if(!map[nom]) map[nom] = { nom, total:0, nb:0 };
    map[nom].total += Number(a.prixGlobal)||0;
    map[nom].nb++;
  }
  return Object.values(map).sort((a,b)=> b.total - a.total);
}

/* ============================================================
   FOURNISSEURS : renommer / fusionner / supprimer / régulariser
   ============================================================ */
function renommerFournisseur(fId, nouveauNom){
  const f = DB.fournisseurs.find(x=>x.id===fId);
  if(!f) return null;
  const nom = nomSain(nouveauNom);
  if(!nom) return null;
  const existant = DB.fournisseurs.find(x=>x.id!==fId && (x.nom||'').toLowerCase() === nom.toLowerCase());
  if(existant){
    // même nom qu'un autre compte : on fusionne tout dessus (rien n'est perdu)
    for(const a of DB.achats){ if(a.fournisseurId===fId){ a.fournisseurId = existant.id; a.fournisseur = existant.nom; } }
    for(const p of DB.paiements){ if(p.fournisseurId===fId) p.fournisseurId = existant.id; }
    for(const r of (DB.regularisationsFournisseur||[])){ if(r.fournisseurId===fId) r.fournisseurId = existant.id; }
    DB.fournisseurs = DB.fournisseurs.filter(x=>x.id!==fId);
    sauverDB();
    return { fusion:true, vers: existant };
  }
  f.nom = nom;
  for(const a of DB.achats){ if(a.fournisseurId===fId) a.fournisseur = nom; }
  sauverDB();
  return { fusion:false, fournisseur:f };
}

function supprimerFournisseur(fId){
  const f = DB.fournisseurs.find(x=>x.id===fId);
  if(!f) return false;
  if(DB.achats.some(a=>a.fournisseurId===fId)) return false;   // sécurité : on ne perd aucun achat
  versCorbeille('fournisseur', f, 'Fournisseur : '+f.nom);
  DB.fournisseurs = DB.fournisseurs.filter(x=>x.id!==fId);
  DB.paiements = DB.paiements.filter(p=>p.fournisseurId!==fId);
  DB.regularisationsFournisseur = (DB.regularisationsFournisseur||[]).filter(r=>r.fournisseurId!==fId);
  sauverDB();
  return true;
}

/* Aligner le compte sur ce qui est réellement dû, sans toucher aux achats ni aux paiements */
function regulariserFournisseur({fournisseurId, montantReel, motif, user, date}){
  const f = DB.fournisseurs.find(x=>x.id===fournisseurId);
  if(!f) return null;
  const reel = Number(montantReel);
  if(isNaN(reel) || reel < 0) return null;
  const brut = soldeFournisseurBrut(fournisseurId);
  const ecart = reel - brut;
  if(ecart === 0) return null;
  if(!DB.regularisationsFournisseur) DB.regularisationsFournisseur = [];
  const r = {
    id: uid('rf'), date: date||auj(), fournisseurId,
    ancienSolde: Math.max(0, brut), nouveauSolde: reel, ecart,
    motif: (motif||'').trim() || 'Non précisé',
    user: (user||'').trim() || 'Gérant'
  };
  DB.regularisationsFournisseur.push(r);
  sauverDB();
  return r;
}
function supprimerRegulFournisseur(id){
  const r = (DB.regularisationsFournisseur||[]).find(x=>x.id===id);
  if(r) versCorbeille('regulFournisseur', r, 'Régularisation fournisseur du '+dateFr(r.date));
  DB.regularisationsFournisseur = (DB.regularisationsFournisseur||[]).filter(x=>x.id!==id);

}

/* ============================================================
   ÉPARGNE — l'argent mis de côté
   Sort de la caisse (ce n'est pas une dépense : l'argent reste à vous)
   et se reporte d'une semaine à l'autre.
   ============================================================ */
function totalEpargne(){
  let t = Number(DB.epargneReportee)||0;
  for(const e of (DB.epargne||[])) t += (e.sens==='retrait' ? -e.montant : e.montant);
  return Math.max(0, t);
}
function ajouterEpargne({date, montant, note}){
  montant = Number(montant)||0;
  if(montant<=0) return null;
  if(!DB.epargne) DB.epargne = [];
  const e = { id: uid('ep'), date: date||auj(), sens:'depot', montant, note:(note||'').trim() };
  DB.epargne.push(e);
  sauverDB();
  return e;
}
function retirerEpargne({date, montant, note}){
  montant = Number(montant)||0;
  if(montant<=0) return null;
  const dispo = totalEpargne();
  if(dispo<=0) return null;
  if(montant > dispo) montant = dispo;      // on ne retire pas plus qu'on n'a mis
  if(!DB.epargne) DB.epargne = [];
  const e = { id: uid('ep'), date: date||auj(), sens:'retrait', montant, note:(note||'').trim() };
  DB.epargne.push(e);
  sauverDB();
  return e;
}
function supprimerMouvementEpargne(id){
  const e = (DB.epargne||[]).find(x=>x.id===id);
  if(e) versCorbeille('epargne', e, (e.sens==='retrait'?'Retrait':'Mise de côté')+' épargne du '+dateFr(e.date));
  DB.epargne = (DB.epargne||[]).filter(x=>x.id!==id);
  sauverDB();
}

/* ============================================================
   TRANSFERTS CAISSE BOISSONS ↔ SOLDE CAFÉ
   Déplace de l'argent d'un pot vers l'autre, avec historique.
   Chaque transfert est plafonné à ce qui est réellement disponible
   dans le pot de départ. Le café accumule sa part dans
   cafeSoldeReporte, mis à jour immédiatement (pas d'attente de clôture).
   ============================================================ */
function transfererVersCafe({date, montant, note}){
  montant = Number(montant)||0;
  if(montant<=0) return null;
  const dispo = soldeCaisse();
  if(dispo<=0) return null;
  if(montant > dispo) montant = dispo;
  if(!DB.transferts) DB.transferts = [];
  const t = { id: uid('tr'), date: date||auj(), sens:'versCafe', montant, note:(note||'').trim() };
  DB.transferts.push(t);
  DB.cafeSoldeReporte = (DB.cafeSoldeReporte||0) + montant;
  sauverDB();
  return t;
}
function transfererVersBoissons({date, montant, note}){
  montant = Number(montant)||0;
  if(montant<=0) return null;
  const dispo = statsCafe().soldeTotal;
  if(dispo<=0) return null;
  if(montant > dispo) montant = dispo;
  if(!DB.transferts) DB.transferts = [];
  const t = { id: uid('tr'), date: date||auj(), sens:'versBoissons', montant, note:(note||'').trim() };
  DB.transferts.push(t);
  DB.cafeSoldeReporte = (DB.cafeSoldeReporte||0) - montant;
  sauverDB();
  return t;
}
function supprimerTransfert(id){
  const t = (DB.transferts||[]).find(x=>x.id===id);
  if(!t) return;
  // annuler l'effet sur le café avant de retirer le mouvement
  DB.cafeSoldeReporte = (DB.cafeSoldeReporte||0) + (t.sens==='versCafe' ? -t.montant : t.montant);
  versCorbeille('transfert', t, (t.sens==='versCafe'?'Transfert vers le café':'Transfert vers les boissons')+' du '+dateFr(t.date)+' ('+fmt(t.montant)+' '+DB.parametres.devise+')');
  DB.transferts = (DB.transferts||[]).filter(x=>x.id!==id);
  sauverDB();
}

    <h2>${versCafe ? "➡️ Transférer vers le café" : "⬅️ Transférer vers les boissons"}</h2>
    <div class="s-sub">${versCafe ? "L'argent sort de la caisse boissons et rejoint le solde café." : "L'argent sort du solde café et rejoint la caisse boissons."}</div>
    <div class="hint" style="margin-bottom:12px">Disponible : <b>${fmt(dispo)} ${dev}</b></div>
    <div class="field"><label>Montant (${dev})</label>
      <input class="input" id="trMontant" type="number" inputmode="numeric" placeholder="Ex: 10000"></div>
    <div class="field"><label>Note (facultatif)</label>
      <input class="input" id="trNote" placeholder="Ex: avance pour achat café"></div>
    <div class="field"><label>Date</label>
      <input class="input" id="trDate" type="date" value="${auj()}"></div>
    <div class="btn-group">
      <button class="btn btn-ghost" onclick="closeSheet()">Annuler</button>
      <button class="btn btn-ambre" onclick="validerTransfert('${sens}')">Transférer</button>
    </div>
  `);
}
function validerTransfert(sens){
  const montant = Number($('#trMontant').value)||0;
  const note = $('#trNote').value.trim();
  const date = $('#trDate').value || auj();
  if(montant<=0){ toast('Indiquez le montant','err'); return; }
  const r = (sens==='versCafe') ? transfererVersCafe({date, montant, note}) : transfererVersBoissons({date, montant, note});
  if(!r){ toast('Rien à transférer (solde à zéro)','err'); return; }
  toast('Transfert enregistré ✓');
  closeSheet();
  go('transferts');
}
function supprTransfertUI(id){
  supprimerTransfert(id);
  toast('Supprimé (dans la corbeille)');
  go('transferts');
}

/* ============================================================
   RATION DU VENDEUR
   Ration journalière + paiement de fin de semaine.
   Le vendeur garde cet argent sur les ventes : c'est une sortie de
   caisse ET une déduction sur ce qu'il doit verser.
   ============================================================ */
function ajouterRation({date, montant, type, note}){
  montant = Number(montant)||0;
  if(montant<=0) return null;
  if(!DB.rationsVendeur) DB.rationsVendeur = [];
  const r = { id: uid('rat'), date: date||auj(), montant,
    type: (type==='semaine' ? 'semaine' : 'jour'), note: nomSain(note) };
  DB.rationsVendeur.push(r);
  sauverDB();
  return r;
}
function supprimerRation(id){
  const r = (DB.rationsVendeur||[]).find(x=>x.id===id);
  if(r) versCorbeille('ration', r, (r.type==='semaine'?'Paiement fin de semaine':'Ration')+' du '+dateFr(r.date)+' ('+fmt(r.montant)+' '+DB.parametres.devise+')');
  DB.rationsVendeur = (DB.rationsVendeur||[]).filter(x=>x.id!==id);
  sauverDB();
}
function totalRations(debut, fin, type){
  const dans = (d)=> (!debut || d>=debut) && (!fin || d<=fin);
  let t = 0;
  for(const r of (DB.rationsVendeur||[])){
    if(!dans(r.date)) continue;
    if(type && r.type!==type) continue;
    t += r.montant;
  }
  return t;
}
function rationDejaDonneeAujourdhui(){
  return (DB.rationsVendeur||[]).some(r=>r.type==='jour' && r.date===auj());
}

function pageRations(){
  const dev = DB.parametres.devise;
  const per = periodeSemaine(auj());
  const mvts = [...(DB.rationsVendeur||[])].sort((a,b)=> a.date<b.date?1:-1);
  const totJour = totalRations(per.debut, per.fin, 'jour');
  const totSem = totalRations(per.debut, per.fin, 'semaine');
  const defaut = Number(DB.parametres && DB.parametres.rationJour)||0;
  const dejaAujourdhui = totalRations(auj(), auj(), 'jour');
  return `
  <div class="page">
    <div class="page-title">🍚 Ration du vendeur</div>
    <div class="page-sub">Ce que vous donnez au vendeur. Déduit de la caisse et de ce qu'il doit vous verser.</div>

    ${barrePole('caisse','rations')}

    <div class="metrics" style="margin-bottom:8px">
      <div class="metric accent"><div class="m-label">Rations de la semaine</div><div class="m-value mono">${fmt(totJour)} ${dev}</div></div>
      <div class="metric"><div class="m-label">Fin de semaine</div><div class="m-value mono">${fmt(totSem)} ${dev}</div></div>
    </div>
    <div class="hint" style="margin-bottom:16px;text-align:center">Total donné cette semaine : <b>${fmt(totJour+totSem)} ${dev}</b></div>

    <button class="btn btn-ambre" onclick="openRationSheet('jour')" style="margin-bottom:10px">🍚 Noter la ration du jour${defaut>0?' ('+fmt(defaut)+' '+dev+')':''}</button>
    <button class="btn btn-ghost" onclick="openRationSheet('semaine')" style="margin-bottom:10px">📅 Paiement de fin de semaine</button>
    ${dejaAujourdhui>0 ? `<div class="hint" style="text-align:center;margin-bottom:16px">Déjà donné aujourd'hui : <b>${fmt(dejaAujourdhui)} ${dev}</b> — vous pouvez en ajouter</div>` : '<div style="height:6px"></div>'}

    <div class="card" style="margin-bottom:14px">
      <div class="card-title" style="font-size:13px;margin-bottom:8px">⚙️ Montant habituel de la ration</div>
      <div class="row2">
        <div class="field" style="margin-bottom:0">
          <input class="input" id="ratDefaut" type="number" inputmode="numeric" placeholder="Ex: 1000" value="${defaut||''}"></div>
        <button class="btn btn-ghost" onclick="enregistrerRationDefaut()">Enregistrer</button>
      </div>
      <div class="hint" style="margin-top:6px">Une fois réglé, un seul bouton suffit chaque jour.</div>
    </div>

    <div class="card">
      <div class="card-title" style="font-size:14px;margin-bottom:8px">Historique de la semaine</div>
      ${mvts.length===0 ? '<div class="hint">Rien pour le moment</div>' :
        mvts.map(r=>`<div class="cat-row">
          <div class="cat-info"><div class="cat-name" style="font-size:14px">${r.type==='semaine'?'📅 Fin de semaine':'🍚 Ration du jour'}</div>
          <div class="cat-meta">${dateFr(r.date)}${r.note?' • '+r.note:''}</div></div>
          <span style="font-weight:700;color:var(--rouge)">−${fmt(r.montant)}</span>
          <button class="btn btn-sm btn-ghost" onclick="supprRationUI('${r.id}')" style="margin-left:8px">🗑️</button>
        </div>`).join('')}
    </div>
  </div>`;
}

function enregistrerRationDefaut(){
  const v = Number($('#ratDefaut').value)||0;
  if(!DB.parametres) DB.parametres = {};
  DB.parametres.rationJour = Math.max(0, v);
  sauverDB();
  toast(v>0 ? 'Montant habituel enregistré ✓' : 'Montant habituel effacé');
  go('rations');
}
/* Le montant varie d'un jour à l'autre : on propose l'habituel, on n'impose rien. */
function rationDuJourRapide(){ openRationSheet('jour'); }
function openRationSheet(type){
  const dev = DB.parametres.devise;
  const sem = (type==='semaine');
  sheet(`
    <h2>${sem ? '📅 Paiement de fin de semaine' : '🍚 Ration du vendeur'}</h2>
    <div class="s-sub">${sem ? "Ce que vous donnez au vendeur en fin de semaine." : "Ce que vous donnez au vendeur pour la journée."} Cet argent sort de la caisse et sera déduit de ce qu'il doit verser.</div>
    ${(!sem && totalRations(auj(), auj(), 'jour')>0) ? `<div class="hint" style="margin-bottom:12px">Déjà donné aujourd'hui : <b>${fmt(totalRations(auj(), auj(), 'jour'))} ${dev}</b></div>` : ''}
    <div class="field"><label>Montant (${dev})</label>
      <input class="input" id="ratMontant" type="number" inputmode="numeric" placeholder="Ex: ${sem?'10000':'1000'}" value="${sem?'':(Number(DB.parametres&&DB.parametres.rationJour)||'')}">
      ${sem?'':'<div class="hint" style="margin-top:5px">Montant proposé — changez-le librement, il varie d\u2019un jour à l\u2019autre.</div>'}</div>
    <div class="field"><label>Note (facultatif)</label>
      <input class="input" id="ratNote" placeholder="${sem?'Ex: prime de la semaine':'Ex: repas'}"></div>
    <div class="field"><label>Date</label>
      <input class="input" id="ratDate" type="date" value="${auj()}"></div>
    <div class="btn-group">
      <button class="btn btn-ghost" onclick="closeSheet()">Annuler</button>
      <button class="btn btn-ambre" onclick="validerRation('${sem?'semaine':'jour'}')">Enregistrer</button>
    </div>
  `);
}
function validerRation(type){
  const montant = Number($('#ratMontant').value)||0;
  const note = $('#ratNote').value.trim();
  const date = $('#ratDate').value || auj();
  if(montant<=0){ toast('Indiquez le montant','err'); return; }
  ajouterRation({date, montant, type, note});
  toast('Enregistré ✓');
  closeSheet();
  go('rations');
}
function supprRationUI(id){
  supprimerRation(id);
  toast('Supprimé (dans la corbeille)');
  go('rations');
}

function pageEpargne(){
  const dev = DB.parametres.devise;
  const mvts = [...(DB.epargne||[])].sort((a,b)=> a.date<b.date?1:-1);
  let deposes = 0, retires = 0;
  for(const e of (DB.epargne||[])){ if(e.sens==='retrait') retires += e.montant; else deposes += e.montant; }
  const reporte = Number(DB.epargneReportee)||0;
  return `
  <div class="page">
    <div class="page-title">🐖 Mon épargne</div>
    <div class="page-sub">L'argent que vous mettez de côté. Il sort de la caisse mais reste à vous.</div>

    ${barrePole('caisse','epargne')}

    <div class="metric accent" style="margin-bottom:14px">
      <div class="m-label">Total mis de côté</div>
      <div class="m-value mono">${fmt(totalEpargne())} ${dev}</div>
    </div>

    <div class="card" style="margin-bottom:16px">
      ${reporte ? `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:var(--texte-doux)">Reporté des semaines passées</span><span style="font-weight:600">${fmt(reporte)} ${dev}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:var(--texte-doux)">Mis de côté cette semaine</span><span style="font-weight:600;color:var(--vert)">+${fmt(deposes)} ${dev}</span></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px"><span style="color:var(--texte-doux)">Repris cette semaine</span><span style="font-weight:600;color:${retires>0?'var(--rouge)':'var(--texte-doux)'}">${retires>0?'−'+fmt(retires):'0'} ${dev}</span></div>
    </div>

    <div class="btn-group" style="flex-wrap:wrap;margin-bottom:16px">
      <button class="btn btn-ambre" onclick="openEpargneSheet('depot')">🐖 Mettre de côté</button>
      <button class="btn btn-ghost" onclick="openEpargneSheet('retrait')">↩️ Reprendre</button>
    </div>

    <div class="card">
      <div class="card-title" style="font-size:14px;margin-bottom:8px">Mouvements de la semaine</div>
      ${mvts.length===0 ? '<div class="hint">Aucun mouvement pour le moment</div>' :
        mvts.map(e=>`<div class="cat-row">
          <div class="cat-info"><div class="cat-name" style="font-size:14px">${e.sens==='retrait'?'↩️ Repris':'🐖 Mis de côté'}</div>
          <div class="cat-meta">${dateFr(e.date)}${e.note?' • '+e.note:''}</div></div>
          <span style="font-weight:700;color:${e.sens==='retrait'?'var(--rouge)':'var(--vert)'}">${e.sens==='retrait'?'−':'+'}${fmt(e.montant)}</span>
          <button class="btn btn-sm btn-ghost" onclick="supprEpargneUI('${e.id}')" style="margin-left:8px">🗑️</button>
        </div>`).join('')}
    </div>
  </div>`;
}

function openEpargneSheet(sens){
  const dev = DB.parametres.devise;
  const retrait = (sens==='retrait');
  sheet(`
    <h2>${retrait?"↩️ Reprendre de l'épargne":"🐖 Mettre de côté"}</h2>
    <div class="s-sub">${retrait?"L'argent revient dans votre caisse.":"L'argent sort de la caisse et rejoint votre épargne. Ce n'est pas une dépense."}</div>
    ${retrait?`<div class="hint" style="margin-bottom:12px">Épargne disponible : <b>${fmt(totalEpargne())} ${dev}</b></div>`:''}
    <div class="field"><label>Montant (${dev})</label>
      <input class="input" id="epMontant" type="number" inputmode="numeric" placeholder="Ex: 10000"></div>
    <div class="field"><label>Note (facultatif)</label>
      <input class="input" id="epNote" placeholder="Ex: pour le frigo, économies"></div>
    <div class="field"><label>Date</label>
      <input class="input" id="epDate" type="date" value="${auj()}"></div>
    <div class="btn-group">
      <button class="btn btn-ghost" onclick="closeSheet()">Annuler</button>
      <button class="btn btn-ambre" onclick="validerEpargne('${retrait?'retrait':'depot'}')">Enregistrer</button>
    </div>
  `);
}
function validerEpargne(sens){
  const montant = Number($('#epMontant').value)||0;
  const note = $('#epNote').value.trim();
  const date = $('#epDate').value || auj();
  if(montant<=0){ toast('Indiquez le montant','err'); return; }
  const r = (sens==='retrait') ? retirerEpargne({date, montant, note}) : ajouterEpargne({date, montant, note});
  if(!r){ toast(sens==='retrait' ? 'Votre épargne est vide' : 'Montant invalide','err'); return; }
  toast(sens==='retrait' ? 'Repris de l\u2019épargne ✓' : 'Mis de côté ✓');
  closeSheet();
  go('epargne');
}
function supprEpargneUI(id){
  supprimerMouvementEpargne(id);
  toast('Supprimé (dans la corbeille)');
  go('epargne');
}

/* ============================================================
   TABLEAU DE BORD (accueil) — achats, ventes, caisse, épargne, café
   ============================================================ */
function blocTableauBord(){
  const dev = DB.parametres.devise;
  const per = periodeSemaine(auj());
  const dans = (d)=> d>=per.debut && d<=per.fin;
  let ventes = 0; for(const inv of DB.inventaires){ if(dans(inv.date)) ventes += inv.totalCA; }
  const saisi = totalVentesSaisies(per.debut, per.fin);
  let achats = 0; for(const a of DB.achats){ if(!a.reporte && dans(a.date)) achats += (Number(a.prixGlobal)||0); }
  const reste = totalDettesFournisseurs();
  const cafeSem = statsCafe(per.debut, per.fin);
  const cafeTot = statsCafe();
  const ligne = (icone, titre, valeur, detail, page, couleur)=>`
    <div class="cat-row" style="cursor:pointer" onclick="go('${page}')">
      <div class="cat-info"><div class="cat-name" style="font-size:14px">${icone} ${titre}</div>
      <div class="cat-meta">${detail}</div></div>
      <span style="font-weight:700;${couleur?'color:'+couleur:''}">${valeur}</span>
    </div>`;
  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><div class="card-title">📊 Tableau de bord — cette semaine</div></div>
      ${ligne('💵','Ventes', fmt(ventes)+' '+dev, saisi>0 ? 'saisi à la main : '+fmt(saisi)+' '+dev : 'calculé par vos inventaires', 'ventesjour', 'var(--vert)')}
      ${(function(){ const a = argentEnAttente(); return a.net>0 ? ligne('⏳','En attente d\u2019inventaire', fmt(a.net)+' '+dev, 'chez le vendeur, pas encore en caisse', 'ventesjour', 'var(--ambre)') : ''; })()}
      ${ligne('🛒','Achats', fmt(achats)+' '+dev, reste>0 ? 'reste à payer : '+fmt(reste)+' '+dev : 'tout est payé ✓', 'achatsjour', reste>0?'var(--texte)':'var(--texte)')}
      ${ligne('💰','Solde en caisse', fmt(soldeCaisse())+' '+dev, 'argent disponible maintenant', 'caisse', 'var(--givre,#5EEAD4)')}
      ${ligne('🐖','Épargne', fmt(totalEpargne())+' '+dev, 'mis de côté (hors caisse)', 'epargne', 'var(--ambre)')}
      ${ligne('☕','Café', fmt(cafeSem.resultat)+' '+dev, 'résultat semaine • solde café : '+fmt(cafeTot.soldeTotal)+' '+dev, 'cafe', cafeSem.resultat<0?'var(--rouge)':'var(--vert)')}
    </div>`;
}
/* ============================================================
   FONCTIONNEMENT HORS CONNEXION
   Installe un petit assistant (sw.js) qui garde l'application dans
   la mémoire du téléphone. Si sw.js n'est pas encore déposé sur le
   serveur, l'application continue de marcher normalement.
   ============================================================ */
try{
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){ /* sans assistant, l'app marche quand même */ });
    });
  }
}catch(e){}

function majEtatConnexion(){
  try{
    const hors = (navigator.onLine === false);
    let el = document.getElementById('bandeauHorsLigne');
    if(hors && !el){
      el = document.createElement('div');
      el.id = 'bandeauHorsLigne';
      el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:78px;z-index:9998;background:#1E293B;border:1px solid #475569;color:#CBD5E1;padding:9px 12px;border-radius:12px;text-align:center;font-size:12.5px;font-weight:600';
      el.textContent = '📴 Hors connexion — FRIGO fonctionne normalement';
      document.body.appendChild(el);
    } else if(!hors && el && el.remove){
      el.remove();
    }
  }catch(e){}
}
try{
  window.addEventListener('online', majEtatConnexion);
  window.addEventListener('offline', majEtatConnexion);
  setTimeout(majEtatConnexion, 1200);
}catch(e){}
/* ============================================================
   ARGENT DE LA CAISSE REMIS AU VENDEUR
   S'ajoute à ce qu'il a encaissé pour payer les fournisseurs.
   Ce n'est PAS un mouvement de caisse : la sortie réelle est déjà
   enregistrée par le paiement du fournisseur.
   ============================================================ */
function ajouterApportCaisse({date, montant, note}){
  montant = Number(montant)||0;
  if(montant<=0) return null;
  if(!DB.apportsCaisse) DB.apportsCaisse = [];
  const a = { id: uid('ap'), date: date||auj(), montant, note:(note||'').trim() };
  DB.apportsCaisse.push(a);
  sauverDB();
  return a;
}
function supprimerApportCaisse(id){
  const a = (DB.apportsCaisse||[]).find(x=>x.id===id);
  if(a) versCorbeille('apportCaisse', a, 'Argent de la caisse du '+dateFr(a.date)+' ('+fmt(a.montant)+' '+DB.parametres.devise+')');
  DB.apportsCaisse = (DB.apportsCaisse||[]).filter(x=>x.id!==id);
  sauverDB();
}
function totalApportsCaisse(debut, fin){
  const dans = (d)=> (!debut || d>=debut) && (!fin || d<=fin);
  let t = 0;
  for(const a of (DB.apportsCaisse||[])){ if(dans(a.date)) t += a.montant; }
  return t;
}

function setQuiPaieFournisseurs(mode){
  if(!DB.parametres) DB.parametres = {};
  DB.parametres.quiPaieFournisseurs = (mode==='patron') ? 'patron' : 'vendeur';
  sauverDB();
  toast(mode==='patron' ? 'Les fournisseurs sont payés par vous ✓' : 'Les fournisseurs sont payés par le vendeur ✓');
  go('caisse');
}

function openApportSheet(){
  const dev = DB.parametres.devise;
  sheet(`
    <h2>➕ Argent de la caisse</h2>
    <div class="s-sub">L'argent que vous avez sorti de la caisse et remis au vendeur pour l'aider à payer les fournisseurs.</div>
    <div class="hint" style="margin-bottom:12px">💰 Disponible en caisse : <b>${fmt(soldeCaisse())} ${dev}</b></div>
    <div class="field"><label>Montant remis (${dev})</label>
      <input class="input" id="apMontant" type="number" inputmode="numeric" placeholder="Ex: 51200"></div>
    <div class="field"><label>Note (facultatif)</label>
      <input class="input" id="apNote" placeholder="Ex: pour payer Depot Baraka"></div>
    <div class="field"><label>Date</label>
      <input class="input" id="apDate" type="date" value="${auj()}"></div>
    <div class="hint" style="margin-bottom:10px">Sert au contrôle du vendeur. La caisse n'est pas diminuée deux fois : la sortie réelle est déjà comptée par le paiement du fournisseur.</div>
    <div class="btn-group">
      <button class="btn btn-ghost" onclick="closeSheet()">Annuler</button>
      <button class="btn btn-ambre" onclick="validerApport()">Enregistrer</button>
    </div>
  `);
}
function validerApport(){
  const montant = Number($('#apMontant').value)||0;
  const note = $('#apNote').value.trim();
  const date = $('#apDate').value || auj();
  if(montant<=0){ toast('Indiquez le montant','err'); return; }
  ajouterApportCaisse({date, montant, note});
  toast('Enregistré ✓');
  closeSheet();
  go('caisse');
}
function supprApportUI(id){
  supprimerApportCaisse(id);
  toast('Supprimé (dans la corbeille)');
  go('caisse');
}
</script>
